# Working directory has to be the top directory "news_platform" - the directory containing the "manage.py"

[supervisord]
nodaemon=true
loglevel=info

[inet_http_server]
port = 9001
priority=100

# Without these two sections the socket on :9001 exists but serves no XML-RPC
# interface, so both the web UI and `supervisorctl -s http://localhost:9001`
# fail ("`.ini` file does not include supervisorctl section").
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = http://localhost:9001

# Redis is broker, result backend and Django cache in one.
#   --save '' / --appendonly no  : no RDB or AOF persistence. Snapshotting
#     fork()s the whole redis process, which briefly doubles its RSS, and none
#     of this data is worth persisting across restarts.
#   --maxmemory-policy volatile-lru : only evicts keys that carry a TTL, i.e.
#     Django cache entries. Celery broker/result keys have no TTL and are
#     therefore never evicted, so queued tasks cannot be silently dropped.
[program:redis]
command=bash -c 'exec redis-server --save "" --appendonly no --maxmemory "${REDIS_MAXMEMORY:-256mb}" --maxmemory-policy volatile-lru'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=150

# --concurrency bounds the number of forked children (the default is one per CPU
# core, and each is a full Django process).
# --max-tasks-per-child recycles a child after N tasks so the memory held by the
# sentence-transformer model and scraped page buffers is returned to the OS.
# Defaults to 1: the refresh pipeline runs as a chain of separate tasks
# (pageHome.py), so recycling per task is what guarantees the torch RSS from
# `group_articles` is gone before the next step starts. Forking is cheap here -
# Django is already loaded in the master and gc.freeze() (celery.py) keeps the
# inherited heap shared copy-on-write - so re-forking per task costs very little.
# Raise CELERY_MAX_TASKS_PER_CHILD if fork overhead ever shows up; celery.py also
# sets worker_max_memory_per_child as an adaptive backstop.
# --prefetch-multiplier=1 stops each child buffering extra task payloads.
# -Q: the 'ml' queue only ever carries `group_articles`. One worker consumes both
# queues by default; to isolate the heavy step completely, run a second worker
# with CELERY_QUEUES=ml and set CELERY_QUEUES=celery here.
[program:celery-worker]
command=bash -c 'while ! nc -z localhost 6379 </dev/null; do echo "celery-worker waiting for redis at port :6379"; sleep 3; done && exec celery -A news_platform worker --loglevel INFO --without-mingle --without-gossip -Q "${CELERY_QUEUES:-celery,ml}" --concurrency "${CELERY_CONCURRENCY:-2}" --max-tasks-per-child "${CELERY_MAX_TASKS_PER_CHILD:-1}" --prefetch-multiplier 1'
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=200

[program:celery-beat]
command=bash -c 'while ! nc -z localhost 80 </dev/null; do echo "celery-beat waiting for django at port :80"; sleep 3; done && exec celery -A news_platform beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel INFO'
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=350

# Flower is a full extra Celery + web process (~100-150MB RSS) and is only a
# monitoring UI. Set ENABLE_FLOWER=false to skip it entirely.
[program:celery-flower]
command=bash -c 'if [ "${ENABLE_FLOWER:-true}" != "true" ]; then echo "celery-flower disabled via ENABLE_FLOWER"; exit 0; fi; while ! nc -z localhost 6379 </dev/null; do echo "celery-flower waiting for redis at port :6379"; sleep 3; done && exec celery -A news_platform flower'
startsecs=20
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=unexpected
exitcodes=0
priority=250

# gunicorn instead of `manage.py runserver`:
#   - runserver keeps an autoreload parent process watching every source file,
#     so the whole app is resident twice.
#   - a fixed, small worker count bounds total memory instead of letting it grow
#     with request concurrency.
#   - --max-requests recycles workers periodically, capping the effect of any
#     slow leak in the scraping/ML code paths.
#
# `manage.py check` is run first on purpose: manage.py's __main__ block performs
# the container bootstrap (migration folders, splash screens, makemigrations,
# migrate, default feeds, admin/user creation) before executing whatever command
# it was given. gunicorn imports the WSGI app directly and would skip all of it,
# so a cheap terminal command is used to trigger the bootstrap exactly once.
[program:python]
command=bash -c 'while ! nc -z localhost 6379 </dev/null; do echo "django waiting for redis at port :6379"; sleep 3; done && python ./manage.py check && exec gunicorn news_platform.wsgi:application --bind 0.0.0.0:80 --workers "${GUNICORN_WORKERS:-2}" --threads "${GUNICORN_THREADS:-4}" --worker-class gthread --max-requests 1000 --max-requests-jitter 100 --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile -'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
priority=300
startsecs=10
autostart=true
autorestart=true
